name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and engine submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Emscripten 6.0.9
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install EPUBCheck 5.3.0
        run: |
          curl -sSLo /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          sudo unzip -q /tmp/epubcheck.zip -d /opt
          printf '#!/bin/sh\nexec java -jar /opt/epubcheck-5.3.0/epubcheck.jar "$@"\n' \
            | sudo tee /usr/local/bin/epubcheck >/dev/null
          sudo chmod +x /usr/local/bin/epubcheck
          epubcheck --version

      - name: Syntax-check the player
        run: |
          node --check web/src/player.js
          node --check web/app/js/boot.js

      - name: Build and validate the EPUB
        run: ./build_all.sh

      - name: Write checksum
        run: sha256sum dist/doom.epub > dist/doom.epub.sha256

      - name: Upload the EPUB
        uses: actions/upload-artifact@v4
        with:
          name: doom.epub
          path: |
            dist/doom.epub
            dist/doom.epub.sha256
          if-no-files-found: error
